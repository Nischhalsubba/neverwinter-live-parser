name: Repair QA setup header v2

on:
  push:
    branches: [agent/release-qa-hardening]
    paths: [.github/workflows/fix-qa-header-v2.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-qa-hardening
          fetch-depth: 0
      - name: Repair setup header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/renderer/components/ObsidianScreens.tsx')
          text = path.read_text()
          pattern = r'<header className="oa-screen-hero">\s*\\1\s*\{props\.operationError \? \(.*?\) : null\}\s*<div className="oa-setup-grid">'
          replacement = (
              '<header className="oa-screen-hero">\n'
              '        <p className="oa-page-kicker">Configuration & Setup</p>\n'
              '        <h1>Connect the Neverwinter combat log</h1>\n'
              '        <p>\n'
              '          Start here the first time you open the app. Live monitoring only watches Neverwinter\n'
              '          files named <code>combatlog_YYYY-MM-DD_HH-MM-SS</code>. Recorded analysis can open a\n'
              '          local <code>.log</code> or <code>.txt</code> file directly.\n'
              '        </p>\n'
              '      </header>\n\n'
              '      {props.operationError ? (\n'
              '        <div className="oa-empty-state" role="alert" style={{ marginBottom: 16 }}>\n'
              '          <span>{props.operationError}</span>\n'
              '          <button className="oa-button secondary" onClick={props.onDismissOperationError}>\n'
              '            Dismiss\n'
              '          </button>\n'
              '        </div>\n'
              '      ) : null}\n\n'
              '      <div className="oa-setup-grid">'
          )
          updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Expected one broken setup header, found {count}')
          path.write_text(updated)
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-qa-header.yml .github/workflows/fix-qa-header-v2.yml
          git add app/src/renderer/components/ObsidianScreens.tsx
          git commit -m "repair setup header"
          git push origin HEAD:agent/release-qa-hardening
