name: Electron 43 security migration validation

on:
  push:
    branches:
      - agent/security-electron-43
    paths:
      - package.json
      - .github/workflows/security-electron-43.yml

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-electron-43
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lockfile
        id: install
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Run existing test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test 2>&1 | tee .security-electron-test.log

      - name: Build renderer and Electron main process
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .security-electron-build.log

      - name: Commit build-validated lockfile
        if: steps.lock.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for Electron 43 migration"
            git push origin HEAD:agent/security-electron-43
          fi

      - name: Record validation status
        if: always()
        run: |
          printf 'lock=%s\ninstall=%s\ntests=%s\nbuild=%s\n' \
            "${{ steps.lock.outcome }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.tests.outcome }}" \
            "${{ steps.build.outcome }}" > .security-electron-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-electron-status.txt
          if [ -f .security-electron-test.log ]; then
            git add .security-electron-test.log
          fi
          if [ -f .security-electron-build.log ]; then
            git add .security-electron-build.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Electron 43 validation diagnostics"
            git push origin HEAD:agent/security-electron-43
          fi

      - name: Fail when install or build did not pass
        if: always() && (steps.lock.outcome != 'success' || steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
