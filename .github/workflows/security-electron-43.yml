name: Electron 43 security migration validation

on:
  push:
    branches:
      - agent/security-electron-43
    paths:
      - package.json

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-electron-43
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from regenerated lockfile
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for Electron 43 migration"
            git push origin HEAD:agent/security-electron-43
          fi
