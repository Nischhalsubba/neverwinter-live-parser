name: Validate Neverwinter live parser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Run typecheck, tests, and build
        run: npm run check

  combat-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run 100k-event combat pipeline stress test
        run: npx --no-install vitest run src/core/aggregation/combatPipeline.stress.test.ts

  import-responsiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Electron worker pipeline
        run: npm run build
      - name: Import 150k events without blocking the main loop
        run: node scripts/qa-import.mjs
        env:
          QA_IMPORT_EVENTS: 150000
          QA_MAX_EVENT_LOOP_DELAY_MS: 750

  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        shell: bash
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unpacked Windows desktop app
        run: npm run dist:win-unpacked
      - name: Verify desktop runtime payload
        shell: pwsh
        run: |
          if (!(Test-Path "dist-electron/main/main.js")) { throw "Missing Electron main bundle" }
          if (!(Test-Path "dist-electron/main/preload.js")) { throw "Missing Electron preload bundle" }
          if (!(Test-Path "dist-electron/core/monitoring/importWorker.js")) { throw "Missing import worker bundle" }
          if (!(Test-Path "release/win-unpacked/resources/app.asar")) { throw "Missing packaged app.asar" }
