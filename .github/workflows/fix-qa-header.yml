name: Repair QA setup header

on:
  push:
    branches: [agent/release-qa-hardening]
    paths: [.github/workflows/fix-qa-header.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-qa-hardening
          fetch-depth: 0
      - name: Repair setup header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/renderer/components/ObsidianScreens.tsx')
          text = path.read_text()
          broken = '''      <header className="oa-screen-hero">
        \\1
    {props.operationError ? (
      <div className="oa-empty-state" role="alert" style={{ marginBottom: 16 }}>
        <span>{props.operationError}</span>
        <button className="oa-button secondary" onClick={props.onDismissOperationError}>
          Dismiss
        </button>
      </div>
    ) : null}

      <div className="oa-setup-grid">'''
          repaired = '''      <header className="oa-screen-hero">
        <p className="oa-page-kicker">Configuration & Setup</p>
        <h1>Connect the Neverwinter combat log</h1>
        <p>
          Start here the first time you open the app. Live monitoring only watches Neverwinter
          files named <code>combatlog_YYYY-MM-DD_HH-MM-SS</code>. Recorded analysis can open a
          local <code>.log</code> or <code>.txt</code> file directly.
        </p>
      </header>

      {props.operationError ? (
        <div className="oa-empty-state" role="alert" style={{ marginBottom: 16 }}>
          <span>{props.operationError}</span>
          <button className="oa-button secondary" onClick={props.onDismissOperationError}>
            Dismiss
          </button>
        </div>
      ) : null}

      <div className="oa-setup-grid">'''
          if broken not in text:
              raise RuntimeError('Broken setup header block not found')
          path.write_text(text.replace(broken, repaired, 1))
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-qa-header.yml
          git add app/src/renderer/components/ObsidianScreens.tsx
          git commit -m "repair setup header"
          git push origin HEAD:agent/release-qa-hardening
