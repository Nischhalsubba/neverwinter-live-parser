          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} occurrences, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          def sub(path, pattern, replacement, expected=1):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=expected, flags=re.S)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} regex replacements, found {count}: {pattern[:100]!r}")
              p.write_text(updated)

