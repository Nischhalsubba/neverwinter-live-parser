name: Apply release QA hardening patch v2

on:
  push:
    branches: [agent/release-qa-hardening]
    paths: [.github/workflows/apply-release-qa-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-qa-hardening
          fetch-depth: 0
      - name: Run corrected hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-release-qa.yml').read_text()
          body_match = re.search(
              r'      - name: Apply focused source fixes\n.*?        run: \|\n(.*?)\n      - name: Verify patch formatting',
              workflow,
              flags=re.S,
          )
          if not body_match:
              raise RuntimeError('Could not extract original QA patch body')
          body = textwrap.dedent(body_match.group(1))
          script_match = re.search(r"python - <<'PY'\n(.*?)\nPY\s*$", body, flags=re.S)
          if not script_match:
              raise RuntimeError('Could not extract original Python patch script')
          script = script_match.group(1)
          script = script.replace(
              "r'''  async function chooseImportFile\\(\\) \\{.*?\\n  \\}\\n\\n  async function discoverLogs\\(\\) \\{''',",
              "r'''(?:  )?async function chooseImportFile\\(\\) \\{.*?\\n  \\}\\n\\n  async function discoverLogs\\(\\) \\{''',",
          )
          exec(compile(script, '<release-qa-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit QA patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-release-qa.yml .github/workflows/apply-release-qa-v2.yml
          git add app/src app/scripts .github/workflows/quality.yml
          git commit -m "harden release QA and log import runtime"
          git push origin HEAD:agent/release-qa-hardening
