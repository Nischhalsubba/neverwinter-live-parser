name: Refresh dependency lockfile

on:
  push:
    branches: [chore/2026-security-baseline]
    paths:
      - 'app/package.json'

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/2026-security-baseline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - name: Refresh lockfile without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile if changed
        working-directory: .
        run: |
          git add app/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:chore/2026-security-baseline
