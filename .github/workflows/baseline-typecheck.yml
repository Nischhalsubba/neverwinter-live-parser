name: Baseline validation

on:
  push:
    branches:
      - agent/baseline-typecheck
    paths:
      - .github/workflows/baseline-typecheck.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/baseline-typecheck
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck baseline
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .baseline-typecheck.log

      - name: Test baseline
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test 2>&1 | tee .baseline-test.log

      - name: Build baseline
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .baseline-build.log

      - name: Record baseline
        if: always()
        run: |
          printf 'install=%s\ntypecheck=%s\ntests=%s\nbuild=%s\n' \
            "${{ steps.install.outcome }}" \
            "${{ steps.typecheck.outcome }}" \
            "${{ steps.tests.outcome }}" \
            "${{ steps.build.outcome }}" > .baseline-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .baseline-status.txt
          for file in .baseline-typecheck.log .baseline-test.log .baseline-build.log; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record baseline validation"
            git push origin HEAD:agent/baseline-typecheck
          fi

      - name: Fail when baseline has failures
        if: always() && (steps.install.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
