name: Baseline typecheck

on:
  push:
    branches:
      - agent/baseline-typecheck
    paths:
      - .github/workflows/baseline-typecheck.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/baseline-typecheck
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck baseline
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .baseline-typecheck.log

      - name: Record baseline
        if: always()
        run: |
          printf 'install=%s\ntypecheck=%s\n' "${{ steps.install.outcome }}" "${{ steps.typecheck.outcome }}" > .baseline-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .baseline-status.txt
          if [ -f .baseline-typecheck.log ]; then
            git add .baseline-typecheck.log
          fi
          git commit -m "Record baseline typecheck"
          git push origin HEAD:agent/baseline-typecheck

      - name: Fail when baseline fails
        if: always() && (steps.install.outcome != 'success' || steps.typecheck.outcome != 'success')
        run: exit 1
