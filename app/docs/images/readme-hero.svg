<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Neverwinter Live Parser desktop combat analysis</title><desc id="desc">Windows desktop dashboard for live combat log tracking, encounter analysis, player rankings, charts, sessions, and local privacy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="110" cy="92" r="150" fill="#2563eb" opacity=".12"/><circle cx="1090" cy="560" r="190" fill="#22c55e" opacity=".07"/><g transform="translate(64 72)"><rect width="66" height="66" rx="16" fill="url(#blue)"/><path d="M18 47 L33 14 L48 47 L33 39 Z" fill="white" opacity=".95"/><text x="88" y="31" font-family="Arial" font-size="34" font-weight="800" fill="white">Neverwinter Live Parser</text><text x="88" y="57" font-family="Arial" font-size="16" fill="#93c5fd">Windows-first. Local-first. Built for live combat review.</text></g><g transform="translate(64 190)" font-family="Arial"><text font-size="50" font-weight="800" fill="white">Track the fight while it happens.</text><text y="48" font-size="21" fill="#cbd5e1">Watch combat logs, preserve sessions, split encounters, and explain performance.</text><g transform="translate(0 96)"><rect width="176" height="50" rx="25" fill="#1d4ed8"/><text x="88" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="white">Live file watching</text><rect x="190" width="176" height="50" rx="25" fill="#0f766e"/><text x="278" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="white">Local session history</text><rect x="380" width="176" height="50" rx="25" fill="#7c3aed"/><text x="468" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="white">Encounter analysis</text></g><g transform="translate(0 190)"><text font-size="17" font-weight="700" fill="#60a5fa">Electron desktop shell</text><text x="180" font-size="17" fill="#e2e8f0">with React, TypeScript, Recharts, and Chokidar</text><text y="36" font-size="17" font-weight="700" fill="#86efac">Private by design</text><text x="145" y="36" font-size="17" fill="#e2e8f0">logs stay on the player’s Windows machine</text><text y="72" font-size="17" font-weight="700" fill="#fcd34d">Portable build</text><text x="120" y="72" font-size="17" fill="#e2e8f0">for quick use without a full installer</text></g></g><g transform="translate(710 62)" filter="url(#s)" font-family="Arial"><rect width="430" height="506" rx="26" fill="#0b1220" stroke="#334155"/><rect width="108" height="506" rx="26" fill="#07101f"/><text x="20" y="36" font-size="13" font-weight="800" fill="white">LIVE PARSER</text><g font-size="11" fill="#94a3b8"><text x="20" y="92">Dashboard</text><text x="20" y="132">Encounters</text><text x="20" y="172">Players</text><text x="20" y="212">Powers</text><text x="20" y="252">Targets</text><text x="20" y="292">Sessions</text><text x="20" y="332">Settings</text></g><rect x="122" y="18" width="288" height="55" rx="14" fill="#111827"/><text x="142" y="41" font-size="11" fill="#94a3b8">ACTIVE LOG</text><text x="142" y="61" font-size="14" font-weight="700" fill="white">combatlog_2026-07-10...</text><circle cx="390" cy="46" r="6" fill="#22c55e"/><g transform="translate(122 90)"><rect width="88" height="82" rx="13" fill="#111827"/><text x="12" y="24" font-size="10" fill="#94a3b8">DPS</text><text x="12" y="53" font-size="24" font-weight="800" fill="#60a5fa">1.82M</text><rect x="100" width="88" height="82" rx="13" fill="#111827"/><text x="112" y="24" font-size="10" fill="#94a3b8">DAMAGE</text><text x="112" y="53" font-size="24" font-weight="800" fill="white">631M</text><rect x="200" width="88" height="82" rx="13" fill="#111827"/><text x="212" y="24" font-size="10" fill="#94a3b8">DURATION</text><text x="212" y="53" font-size="24" font-weight="800" fill="#fbbf24">05:47</text></g><g transform="translate(122 188)"><rect width="288" height="132" rx="15" fill="#111827"/><text x="14" y="24" font-size="11" font-weight="700" fill="#cbd5e1">Damage over time</text><path d="M18 103 C45 98 52 45 80 68 S118 48 145 75 S190 34 218 62 S258 48 274 92" fill="none" stroke="#3b82f6" stroke-width="4"/><path d="M18 103 C45 98 52 45 80 68 S118 48 145 75 S190 34 218 62 S258 48 274 92 L274 112 L18 112 Z" fill="#2563eb" opacity=".18"/></g><g transform="translate(122 336)"><rect width="288" height="146" rx="15" fill="#111827"/><text x="14" y="24" font-size="11" font-weight="700" fill="#cbd5e1">Party ranking</text><g font-size="11"><text x="14" y="51" fill="#fbbf24">1</text><text x="34" y="51" fill="#93c5fd">Archew</text><text x="210" y="51" fill="#86efac">1.82M</text><text x="14" y="78" fill="#94a3b8">2</text><text x="34" y="78" fill="#cbd5e1">Player Two</text><text x="210" y="78" fill="#86efac">1.48M</text><text x="14" y="105" fill="#94a3b8">3</text><text x="34" y="105" fill="#cbd5e1">Player Three</text><text x="210" y="105" fill="#86efac">1.21M</text></g></g></g></svg>